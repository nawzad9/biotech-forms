<!DOCTYPE html>
<html lang="ckb" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>فۆڕمەکانی بەشی بایۆتەکنەلۆجی</title>
<meta name="description" content="پۆرتاڵی فۆڕمە فەرمییەکانی بەشی بایۆتەکنەلۆجی – زانکۆی ڕاپەڕین">
<meta name="theme-color" content="#0f766e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="فۆڕمەکان">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Kufi+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --brand:#0f766e; --brand-2:#065f46; --accent:#f59e0b;
  --bg:#f4f7f6; --surface:#ffffff; --surface-2:#eef3f2;
  --text:#0f1b19; --muted:#5b6b68; --line:#dce5e3;
  --shadow:0 1px 2px rgba(15,27,25,.06),0 8px 24px rgba(15,27,25,.07);
  --radius:18px;
}
:root[data-theme="dark"]{
  --bg:#07100f; --surface:#0f1a18; --surface-2:#16231f;
  --text:#e8f1ee; --muted:#93a8a3; --line:#1f2f2b;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.45);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#07100f; --surface:#0f1a18; --surface-2:#16231f;
    --text:#e8f1ee; --muted:#93a8a3; --line:#1f2f2b;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.45);
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family:"Noto Kufi Arabic",system-ui,-apple-system,"Segoe UI",sans-serif;
  background:var(--bg); color:var(--text);
  line-height:1.7; overflow-x:hidden;
  padding-bottom:env(safe-area-inset-bottom);
}
button,input,select{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}

/* ---------- header ---------- */
.top{
  position:sticky;top:0;z-index:50;
  background:linear-gradient(135deg,var(--brand),var(--brand-2));
  color:#fff; padding:calc(env(safe-area-inset-top) + 14px) 16px 14px;
  box-shadow:0 2px 20px rgba(6,95,70,.25);
}
.top-row{display:flex;align-items:center;gap:12px;max-width:1100px;margin:0 auto}
.logo{width:42px;height:42px;border-radius:12px;flex:0 0 auto;background:rgba(255,255,255,.14);display:grid;place-items:center}
.logo svg{width:26px;height:26px}
.titles{flex:1;min-width:0}
.titles h1{margin:0;font-size:1.02rem;font-weight:700;letter-spacing:-.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.titles p{margin:1px 0 0;font-size:.74rem;opacity:.82;font-weight:400}
.icon-btn{
  width:38px;height:38px;border-radius:11px;display:grid;place-items:center;
  background:rgba(255,255,255,.14);color:#fff;flex:0 0 auto;transition:background .18s
}
.icon-btn:active{background:rgba(255,255,255,.3)}
.icon-btn svg{width:19px;height:19px}

.search-wrap{max-width:1100px;margin:12px auto 0;position:relative}
.search-wrap svg{position:absolute;inset-inline-start:13px;top:50%;transform:translateY(-50%);width:17px;height:17px;opacity:.55;pointer-events:none}
#q{
  width:100%;padding:11px 42px 11px 42px;border-radius:13px;border:0;
  background:rgba(255,255,255,.16);color:#fff;font-size:.9rem;outline:none
}
#q::placeholder{color:rgba(255,255,255,.7)}
#q:focus{background:rgba(255,255,255,.24)}
#clearQ{position:absolute;inset-inline-end:8px;top:50%;transform:translateY(-50%);width:28px;height:28px;border-radius:50%;display:none;place-items:center;background:rgba(255,255,255,.2);color:#fff}
#clearQ.on{display:grid}

/* ---------- chips ---------- */
.chips{
  display:flex;gap:8px;overflow-x:auto;padding:12px 16px 2px;
  max-width:1100px;margin:0 auto;scrollbar-width:none
}
.chips::-webkit-scrollbar{display:none}
.chip{
  white-space:nowrap;padding:7px 14px;border-radius:999px;
  background:var(--surface);border:1px solid var(--line);color:var(--muted);
  font-size:.8rem;font-weight:500;display:flex;align-items:center;gap:6px;transition:.18s
}
.chip b{font-size:.68rem;background:var(--surface-2);padding:1px 6px;border-radius:999px;font-weight:600}
.chip.on{background:var(--brand);border-color:var(--brand);color:#fff}
.chip.on b{background:rgba(255,255,255,.22)}

.bar{
  max-width:1100px;margin:10px auto 0;padding:0 16px;
  display:flex;align-items:center;justify-content:space-between;gap:10px
}
.count{font-size:.76rem;color:var(--muted)}
.view-tg{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:3px}
.view-tg button{width:30px;height:26px;border-radius:7px;display:grid;place-items:center;color:var(--muted)}
.view-tg button.on{background:var(--brand);color:#fff}
.view-tg svg{width:15px;height:15px}

/* ---------- cards ---------- */
main{max-width:1100px;margin:0 auto;padding:14px 16px 90px}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(168px,1fr))}
.grid.list{grid-template-columns:1fr}

.card{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
  overflow:hidden;box-shadow:var(--shadow);display:flex;flex-direction:column;
  transition:transform .16s,box-shadow .16s;position:relative
}
.card:active{transform:scale(.985)}
.thumb{
  position:relative;aspect-ratio:3/4;background:var(--surface-2);
  display:grid;place-items:center;overflow:hidden;cursor:pointer
}
.thumb img{width:100%;height:100%;object-fit:cover;object-position:top;display:block}
.thumb .ph{width:46px;height:46px;opacity:.3}
.badge{
  position:absolute;top:8px;inset-inline-start:8px;z-index:2;
  background:rgba(15,118,110,.92);color:#fff;font-size:.6rem;font-weight:600;
  padding:3px 8px;border-radius:999px;backdrop-filter:blur(6px)
}
.fav{
  position:absolute;top:6px;inset-inline-end:6px;z-index:2;
  width:30px;height:30px;border-radius:50%;display:grid;place-items:center;
  background:rgba(0,0,0,.35);color:#fff;backdrop-filter:blur(6px)
}
.fav svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2}
.fav.on{color:var(--accent)} .fav.on svg{fill:var(--accent);stroke:var(--accent)}

.body{padding:10px 11px 11px;display:flex;flex-direction:column;flex:1;gap:8px}
.name{font-size:.81rem;font-weight:600;line-height:1.5;margin:0;cursor:pointer;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.cat{font-size:.66rem;color:var(--muted);margin:0}
.acts{display:flex;gap:6px;margin-top:auto}
.acts button{
  flex:1;height:33px;border-radius:9px;display:grid;place-items:center;
  background:var(--surface-2);color:var(--muted);transition:.16s
}
.acts button svg{width:16px;height:16px}
.acts button.main{background:var(--brand);color:#fff;flex:1.6}
.acts button:active{opacity:.7}

/* list layout */
.grid.list .card{flex-direction:row;align-items:stretch}
.grid.list .thumb{aspect-ratio:auto;width:78px;flex:0 0 78px}
.grid.list .thumb .ph{width:30px;height:30px}
.grid.list .badge,.grid.list .fav{display:none}
.grid.list .body{padding:11px 12px}
.grid.list .name{-webkit-line-clamp:2}
.grid.list .acts{margin-top:8px}

/* ---------- skeleton / empty ---------- */
.sk{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.sk .a{aspect-ratio:3/4;background:linear-gradient(90deg,var(--surface-2) 25%,var(--line) 50%,var(--surface-2) 75%);background-size:200% 100%;animation:sh 1.3s infinite}
.sk .b{height:11px;margin:11px;border-radius:6px;background:var(--surface-2)}
@keyframes sh{0%{background-position:200% 0}100%{background-position:-200% 0}}
.empty{text-align:center;padding:60px 20px;color:var(--muted)}
.empty svg{width:52px;height:52px;opacity:.3;margin-bottom:12px}

/* ---------- modal ---------- */
.sheet{
  position:fixed;inset:0;z-index:100;background:rgba(5,12,11,.72);
  backdrop-filter:blur(4px);display:none;align-items:flex-end;justify-content:center
}
.sheet.on{display:flex}
.panel{
  background:var(--surface);width:100%;max-width:860px;height:92vh;
  border-radius:22px 22px 0 0;display:flex;flex-direction:column;overflow:hidden;
  animation:up .26s cubic-bezier(.3,.9,.3,1)
}
@keyframes up{from{transform:translateY(100%)}to{transform:translateY(0)}}
@media(min-width:760px){
  .sheet{align-items:center}
  .panel{height:88vh;border-radius:20px;animation:pop .2s ease}
  @keyframes pop{from{opacity:0;transform:scale(.97)}to{opacity:1;transform:scale(1)}}
}
.ph-head{padding:13px 14px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;flex:0 0 auto}
.ph-head h3{margin:0;font-size:.88rem;font-weight:600;flex:1;line-height:1.5;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ph-close{width:34px;height:34px;border-radius:10px;background:var(--surface-2);display:grid;place-items:center;color:var(--muted);flex:0 0 auto}
.ph-close svg{width:17px;height:17px}
.frame{flex:1;position:relative;background:var(--surface-2)}
.frame iframe{width:100%;height:100%;border:0;display:block}
.frame .load{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted);font-size:.8rem;gap:10px;text-align:center;padding:24px}
.spin{width:28px;height:28px;border:3px solid var(--line);border-top-color:var(--brand);border-radius:50%;animation:rot .8s linear infinite;margin:0 auto}
@keyframes rot{to{transform:rotate(360deg)}}
.ph-foot{
  padding:11px 14px calc(11px + env(safe-area-inset-bottom));
  border-top:1px solid var(--line);display:flex;gap:8px;flex:0 0 auto
}
.ph-foot button{
  flex:1;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;
  gap:7px;font-size:.82rem;font-weight:600;background:var(--surface-2);color:var(--text)
}
.ph-foot button.main{background:var(--brand);color:#fff}
.ph-foot button svg{width:17px;height:17px}
.ph-foot button:active{opacity:.75}

/* ---------- email dialog ---------- */
.panel.dlg{height:auto;max-height:92vh}
@media(min-width:760px){ .panel.dlg{height:auto;max-width:460px} }
.dlg-body{padding:16px 16px 6px;overflow-y:auto}
.dlg-form{
  margin:0 0 16px;padding:10px 12px;border-radius:12px;background:var(--surface-2);
  font-size:.8rem;font-weight:600;line-height:1.6
}
.dlg-body label{display:block;font-size:.74rem;color:var(--muted);margin:0 0 6px;font-weight:500}
.dlg-body input,.dlg-body textarea{
  width:100%;padding:11px 13px;border-radius:12px;border:1px solid var(--line);
  background:var(--bg);color:var(--text);font-size:.85rem;outline:none;margin:0 0 14px;
  resize:none;transition:border-color .16s
}
.dlg-body input:focus,.dlg-body textarea:focus{border-color:var(--brand)}
.dlg-hint{font-size:.72rem;color:var(--muted);line-height:1.7;min-height:1.2em}
.dlg-hint.err{color:#dc2626}
.dlg-hint.ok{color:var(--brand);font-weight:600}
:root[data-theme="dark"] .dlg-hint.err{color:#f87171}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]) .dlg-hint.err{color:#f87171} }

/* ---------- toast / install ---------- */
#toast{
  position:fixed;bottom:calc(22px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%) translateY(16px);
  background:#0f1b19;color:#fff;padding:10px 18px;border-radius:999px;font-size:.8rem;
  z-index:200;opacity:0;pointer-events:none;transition:.25s;box-shadow:0 8px 28px rgba(0,0,0,.3);
  max-width:88vw;text-align:center
}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
#install{
  position:fixed;bottom:calc(16px + env(safe-area-inset-bottom));inset-inline-start:16px;inset-inline-end:16px;
  max-width:460px;margin:0 auto;background:var(--surface);border:1px solid var(--line);
  border-radius:16px;box-shadow:var(--shadow);padding:12px;display:none;align-items:center;gap:11px;z-index:150
}
#install.on{display:flex}
#install .ic{width:40px;height:40px;border-radius:11px;flex:0 0 auto}
#install div{flex:1;min-width:0}
#install p{margin:0;font-size:.78rem;font-weight:600}
#install small{color:var(--muted);font-size:.68rem}
#install .go{background:var(--brand);color:#fff;padding:8px 14px;border-radius:10px;font-size:.76rem;font-weight:600}
#install .no{color:var(--muted);padding:8px;font-size:1rem}

footer{text-align:center;padding:24px 16px 34px;color:var(--muted);font-size:.7rem;line-height:1.9}
</style>
</head>
<body>

<header class="top">
  <div class="top-row">
    <div class="logo" id="logoBox"></div>
    <div class="titles">
      <h1>فۆڕمەکانی بەشی بایۆتەکنەلۆجی</h1>
      <p>زانکۆی ڕاپەڕین – کۆلێژی زانست</p>
    </div>
    <button class="icon-btn" id="favBtn" title="دڵخوازەکان" aria-label="دڵخوازەکان">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-7-4.5-9-9a5 5 0 0 1 9-3 5 5 0 0 1 9 3c-2 4.5-9 9-9 9z"/></svg>
    </button>
    <button class="icon-btn" id="themeBtn" title="ڕووناک / تاریک" aria-label="گۆڕینی ڕەنگ">
      <svg id="themeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
    </button>
  </div>
  <div class="search-wrap">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.2-3.2"/></svg>
    <input id="q" type="search" placeholder="گەڕان بەدوای فۆڕمێک…" autocomplete="off">
    <button id="clearQ" aria-label="سڕینەوە">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" width="13" height="13"><path d="M18 6 6 18M6 6l12 12"/></svg>
    </button>
  </div>
</header>

<nav class="chips" id="chips"></nav>

<div class="bar">
  <span class="count" id="count"></span>
  <div class="view-tg">
    <button id="vGrid" class="on" aria-label="تۆڕ">
      <svg viewBox="0 0 24 24" fill="currentColor"><rect x="3" y="3" width="7.5" height="7.5" rx="1.5"/><rect x="13.5" y="3" width="7.5" height="7.5" rx="1.5"/><rect x="3" y="13.5" width="7.5" height="7.5" rx="1.5"/><rect x="13.5" y="13.5" width="7.5" height="7.5" rx="1.5"/></svg>
    </button>
    <button id="vList" aria-label="لیست">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
    </button>
  </div>
</div>

<main><div class="grid" id="grid"></div></main>

<footer>
  زانکۆی ڕاپەڕین – بەشی بایۆتەکنەلۆجی<br>
  <span id="stamp"></span>
</footer>

<!-- preview sheet -->
<div class="sheet" id="sheet">
  <div class="panel">
    <div class="ph-head">
      <h3 id="pvName"></h3>
      <button class="ph-close" id="pvClose" aria-label="داخستن">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </button>
    </div>
    <div class="frame" id="frame">
      <div class="load" id="pvLoad"><div><div class="spin"></div><p style="margin:10px 0 0">کردنەوەی فۆڕم…</p></div></div>
    </div>
    <div class="ph-foot">
      <button class="main" id="pvShare">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v13M12 3 8 7M12 3l4 4"/><path d="M5 13v6a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-6"/></svg>
        ناردن
      </button>
      <button id="pvDl">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12M8 11l4 4 4-4"/><path d="M4 19h16"/></svg>
        داگرتن
      </button>
      <button id="pvMail">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>
        ئیمەیڵ
      </button>
      <button id="pvOpen">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 4h6v6"/><path d="M20 4 10 14"/><path d="M19 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1h5"/></svg>
      </button>
    </div>
  </div>
</div>

<!-- email dialog -->
<div class="sheet" id="mailSheet">
  <div class="panel dlg">
    <div class="ph-head">
      <h3>ناردنی فۆڕم بە ئیمەیڵ</h3>
      <button class="ph-close" id="mailClose" aria-label="داخستن">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </button>
    </div>
    <div class="dlg-body">
      <p class="dlg-form" id="mailForm"></p>
      <label for="mailTo">ناونیشانی ئیمەیڵ</label>
      <input id="mailTo" type="email" inputmode="email" autocomplete="email" dir="ltr" placeholder="name@example.com">
      <label for="mailNote">تێبینی (ئارەزوومەندانە)</label>
      <textarea id="mailNote" rows="3" placeholder="…"></textarea>
      <div class="dlg-hint" id="mailHint"></div>
    </div>
    <div class="ph-foot">
      <button class="main" id="mailSend">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 3 10.5 13.5"/><path d="M21 3 14.5 21l-4-7.5L3 9.5z"/></svg>
        ناردن
      </button>
      <button id="mailApp">ئەپی ئیمەیڵ</button>
    </div>
  </div>
</div>

<div id="install">
  <img class="ic" id="installIc" alt="">
  <div><p>دابەزاندنی ئەپ</p><small>بۆ دەستگەیشتنی خێرا لە ڕووپۆشی مۆبایل</small></div>
  <button class="go" id="installGo">دابەزاندن</button>
  <button class="no" id="installNo" aria-label="نا">×</button>
</div>

<div id="toast"></div>

<script>

   CONFIG

 {n:"فۆرمەکانی پێدانی نازناوی م.ی",c:"نازناو و پلەبەرزکردنەوە",e:"Academic Titles & Promotion",id:"1cEYFZHI3ajggWQL9hHu68BtwjIH3nCTA"},

/* ============================================================
   icon generation (canvas → PNG data URL) — no image files needed
   ============================================================ */
function rr(x,a,b,w,h,r){
  x.beginPath();
  x.moveTo(a+r,b); x.lineTo(a+w-r,b); x.quadraticCurveTo(a+w,b,a+w,b+r);
  x.lineTo(a+w,b+h-r); x.quadraticCurveTo(a+w,b+h,a+w-r,b+h);
  x.lineTo(a+r,b+h); x.quadraticCurveTo(a,b+h,a,b+h-r);
  x.lineTo(a,b+r); x.quadraticCurveTo(a,b,a+r,b); x.closePath();
}
function makeIcon(size,pad){
  const c=el('canvas'); c.width=c.height=size;
  const x=c.getContext('2d'), s=size;
  const g=x.createLinearGradient(0,0,s,s);
  g.addColorStop(0,'#14b8a6'); g.addColorStop(.55,'#0f766e'); g.addColorStop(1,'#064e3b');
  rr(x,0,0,s,s,s*0.23); x.fillStyle=g; x.fill();

  const k=pad?0.70:0.84, o=(1-k)/2*s, u=s*k;  // maskable safe-zone
  // document sheet
  x.fillStyle='rgba(255,255,255,.96)';
  rr(x,o+u*0.20,o+u*0.08,u*0.60,u*0.84,u*0.08); x.fill();
  // folded corner
  x.fillStyle='rgba(13,148,136,.28)';
  x.beginPath();
  x.moveTo(o+u*0.80,o+u*0.08); x.lineTo(o+u*0.80,o+u*0.26); x.lineTo(o+u*0.62,o+u*0.26);
  x.closePath(); x.fill();
  // DNA double helix over the sheet
  x.strokeStyle='#0f766e'; x.lineWidth=Math.max(2,u*0.045); x.lineCap='round';
  const top=o+u*0.30, bot=o+u*0.80, cx=o+u*0.50, amp=u*0.14;
  for(const dir of [1,-1]){
    x.beginPath();
    for(let i=0;i<=40;i++){
      const t=i/40, yy=top+(bot-top)*t;
      const xx=cx+dir*amp*Math.sin(t*Math.PI*2.2);
      i?x.lineTo(xx,yy):x.moveTo(xx,yy);
    }
    x.stroke();
  }
  x.lineWidth=Math.max(1.5,u*0.032); x.strokeStyle='rgba(245,158,11,.95)';
  for(let i=1;i<=5;i++){
    const t=i/6, yy=top+(bot-top)*t;
    const dx=amp*Math.sin(t*Math.PI*2.2);
    x.beginPath(); x.moveTo(cx+dx,yy); x.lineTo(cx-dx,yy); x.stroke();
  }
  return c.toDataURL('image/png');
}

/* The manifest and icons are real files now (manifest.json, icon-*.png) — that is
   what lets Android mint a WebAPK instead of a plain home-screen shortcut.
   The canvas drawing is kept only as a fallback for the in-app logo, so the
   header still looks right if the PNG hasn't loaded yet. */
function setupPWA(){
  const logo=$('#logoBox');
  const im=new Image();
  im.onload =()=>{ logo.innerHTML=`<img src="icon-192.png" style="width:30px;height:30px;border-radius:8px">`; };
  im.onerror=()=>{ try{ logo.innerHTML=`<img src="${makeIcon(192,false)}" style="width:30px;height:30px;border-radius:8px">`; }catch(e){} };
  im.src='icon-192.png';
  $('#installIc').src='icon-192.png';
}

function applyTheme(t){
  if(t) document.documentElement.setAttribute('data-theme',t);
  else document.documentElement.removeAttribute('data-theme');
  const dark = t==='dark' || (!t && matchMedia('(prefers-color-scheme:dark)').matches);
  $('#themeIcon').innerHTML = dark
    ? '<circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2M12 19.5v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M2.5 12h2M19.5 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4"/>'
    : '<path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>';
}
applyTheme(store.get('theme',null));
$('#themeBtn').onclick=()=>{
  const cur=document.documentElement.getAttribute('data-theme');
  const sysDark=matchMedia('(prefers-color-scheme:dark)').matches;
  const next = cur ? (cur==='dark'?'light':'dark') : (sysDark?'light':'dark');
  store.set('theme',next); applyTheme(next);
};

function cats(){
  const m=new Map();
  FORMS.forEach(f=>m.set(f.c,(m.get(f.c)||0)+1));
  return [...m.entries()].sort((a,b)=>b[1]-a[1]);
}

function drawChips(){
  const c=$('#chips'); c.innerHTML='';
  const mk=(label,count,val)=>{
    const b=el('button','chip'+(activeCat===val&&!onlyFav?' on':''));
    b.innerHTML=`${label}<b>${count}</b>`;
    b.onclick=()=>{ activeCat=val; onlyFav=false; drawChips(); draw(); };
    c.appendChild(b);
  };
  mk('هەموو',FORMS.length,'ALL');
  cats().forEach(([name,n])=>mk(name,n,name));
}

function filtered(){
  const q=query.trim().toLowerCase();
  return FORMS.filter(f=>{
    if(onlyFav && !favs.includes(f.id)) return false;
    if(!onlyFav && activeCat!=='ALL' && f.c!==activeCat) return false;
    if(!q) return true;
    return (f.n+' '+f.c+' '+(f.e||'')).toLowerCase().includes(q);
  });
}

  const g=$('#grid'); g.innerHTML='';
  for(let i=0;i<8;i++){

    g.appendChild(s);

    e.innerHTML=`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.2-3.2"/></svg><p>هیچ فۆڕمێک نەدۆزرایەوە</p>`;
    g.appendChild(e); return;
  }

  list.forEach(f=>{
    const card=el('article','card');

    const th=el('div','thumb');
    th.innerHTML=`<svg class="ph" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/></svg>`;
    const b0=el('span','badge'); b0.textContent='PDF'; th.appendChild(b0);
    th.appendChild(favBtn());
    th.onclick=()=>preview(f);
    loadThumb(th,f);

    function favBtn(){
      const fb=el('button','fav'+(favs.includes(f.id)?' on':''));
      fb.innerHTML='<svg viewBox="0 0 24 24"><path d="M12 21s-7-4.5-9-9a5 5 0 0 1 9-3 5 5 0 0 1 9 3c-2 4.5-9 9-9 9z"/></svg>';
      fb.onclick=ev=>{
        ev.stopPropagation();
        const i=favs.indexOf(f.id);
        if(i<0){ favs.push(f.id); toast('زیادکرا بۆ دڵخوازەکان'); }
        else { favs.splice(i,1); toast('لابرا لە دڵخوازەکان'); }

      };
      return fb;
    }

    const body=el('div','body');
    const nm=el('h2','name'); nm.textContent=f.n; nm.onclick=()=>preview(f);
    const ct=el('p','cat'); ct.textContent=f.c;
    const ac=el('div','acts');

    bS.onclick=()=>share(f);

    const bD=el('button'); bD.title='داگرتن';
    bD.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12M8 11l4 4 4-4"/><path d="M4 19h16"/></svg>';

    ac.append(bP,bS,bD);

    card.append(th,body);

/* ============================================================
   thumbnails
   Drive's public thumbnail endpoint is tried first (fast, no backend hit).
   When it 403s — which it does for some files even in a public folder — we
   fall back to the Apps Script backend, which renders the thumbnail with the
   owner's own Drive access. Results are cached so this happens once.
   ============================================================ */
const thumbCache = store.get('thumbs',{});
let thumbSaveT;
function saveThumbs(){ clearTimeout(thumbSaveT); thumbSaveT=setTimeout(()=>store.set('thumbs',thumbCache),600); }

function showThumb(th,src,alt){
  const img=new Image();
  img.alt=alt; img.decoding='async';
  img.onload=()=>{
    if(!th.isConnected) return;
    const ph=th.querySelector('.ph'); if(ph) ph.remove();
    th.insertBefore(img, th.firstChild);
  };
  img.src=src;
}

/* at most 3 backend thumbnail requests in flight — Apps Script is slow */
const tq={q:[],busy:0};
function queueThumb(fn){ tq.q.push(fn); pumpThumbs(); }
function pumpThumbs(){
  while(tq.busy<3 && tq.q.length){
    tq.busy++;
    tq.q.shift()().finally(()=>{ tq.busy--; pumpThumbs(); });
  }
}

function loadThumb(th,f){
  if(thumbCache[f.id]){ showThumb(th,thumbCache[f.id],f.n); return; }
  const probe=new Image();
  probe.alt=f.n; probe.loading='lazy'; probe.decoding='async';
  probe.onload=()=>{
    if(!th.isConnected) return;
    const ph=th.querySelector('.ph'); if(ph) ph.remove();
    th.insertBefore(probe, th.firstChild);
  };
  probe.onerror=()=>{ if(CONFIG.API) queueThumb(()=>backendThumb(th,f)); };
  probe.src=thumbUrl(f.id);
}

async function backendThumb(th,f){
  try{
    const r=await fetch(`${CONFIG.API}?action=thumb&id=${encodeURIComponent(f.id)}`);
    const j=await r.json();
    if(j && j.ok && j.data){
      const src='data:'+(j.mime||'image/png')+';base64,'+j.data;
      thumbCache[f.id]=src; saveThumbs();
      showThumb(th,src,f.n);
    }
  }catch(e){ /* placeholder stays */ }
}

let current=null;
function preview(f){
  current=f;
  $('#pvName').textContent=f.n;
  const fr=$('#frame');
  fr.innerHTML='<div class="load"><div><div class="spin"></div><p style="margin:10px 0 0">کردنەوەی فۆڕم…</p></div></div>';
  const ifr=el('iframe');
  ifr.allow='autoplay'; ifr.title=f.n;
  ifr.onload=()=>{ const l=fr.querySelector('.load'); if(l) l.remove(); };
  ifr.src=prevUrl(f.id);
  fr.appendChild(ifr);
  setTimeout(()=>{
    const l=fr.querySelector('.load');
    if(l) l.innerHTML='<div><p>ئەگەر فۆڕمەکە دەرنەکەوت، دڵنیابە فۆڵدەری درایڤ بە <b>Anyone with the link</b> هاوبەش کراوە.</p></div>';
  },9000);
  $('#sheet').classList.add('on');
  document.body.style.overflow='hidden';
  bump(f);
  ping('view',f.id);
}
function closeSheet(){
  $('#sheet').classList.remove('on');
  $('#frame').innerHTML='';
  document.body.style.overflow='';
}
$('#pvClose').onclick=closeSheet;
$('#sheet').onclick=e=>{ if(e.target.id==='sheet') closeSheet(); };
document.addEventListener('keydown',e=>{
  if(e.key!=='Escape') return;
  if($('#mailSheet').classList.contains('on')) closeMail();
  else if($('#sheet').classList.contains('on')) closeSheet();
});

function download(f){
  ping('download',f.id);
  const a=el('a'); a.href=dlUrl(f.id); a.target='_blank'; a.rel='noopener';
  document.body.appendChild(a); a.click(); a.remove();
  toast('داگرتن دەستی پێکرد…');
}

async function share(f){
  const url=viewUrl(f.id);
  ping('share',f.id);

  // 1) try sharing the real PDF file (needs the Apps Script backend)
  if(CONFIG.API && navigator.canShare){
    try{
      toast('ئامادەکردنی فایل…');
      const r=await fetch(`${CONFIG.API}?action=file&id=${encodeURIComponent(f.id)}`);
      const j=await r.json();
      if(j && j.ok && j.data){
        const bin=atob(j.data), arr=new Uint8Array(bin.length);
        for(let i=0;i<bin.length;i++) arr[i]=bin.charCodeAt(i);
        const file=new File([arr], (j.name||f.n)+(/\.pdf$/i.test(j.name||'')?'':'.pdf'), {type:j.mime||'application/pdf'});
        if(navigator.canShare({files:[file]})){
          await navigator.share({files:[file],title:f.n});
          return;
        }
      }
    }catch(err){ /* fall through to link share */ }
  }

  // 2) share the link through the OS share sheet
  if(navigator.share){
    try{ await navigator.share({title:f.n,text:f.n,url}); return; }
    catch(e){ if(e.name==='AbortError') return; }
  }

  // 3) copy to clipboard
  try{ await navigator.clipboard.writeText(url); toast('بەستەر کۆپی کرا'); }
  catch(e){ window.open(url,'_blank','noopener'); }
}

$('#pvShare').onclick=()=>current&&share(current);
$('#pvDl').onclick   =()=>current&&download(current);
$('#pvMail').onclick =()=>current&&openMail(current);
$('#pvOpen').onclick =()=>current&&window.open(viewUrl(current.id),'_blank','noopener');

/* ============================================================
   email
   With the backend: Apps Script mails the PDF as a real attachment.
   Without it: falls back to a mailto: link carrying the Drive link.
   ============================================================ */
let mailFor=null;
function openMail(f){
  mailFor=f;
  $('#mailForm').textContent=f.n;
  $('#mailTo').value=store.get('lastEmail','');
  $('#mailNote').value='';
  const hint=$('#mailHint');
  hint.className='dlg-hint';
  hint.textContent = CONFIG.API
    ? 'فۆڕمەکە وەک پەڕگەی PDF هاوپێچ دەکرێت.'
    : 'بەستەری فۆڕمەکە دەنێردرێت (پەڕگە هاوپێچ ناکرێت).';
  $('#mailSend').disabled=false;
  $('#mailSheet').classList.add('on');
  document.body.style.overflow='hidden';
  setTimeout(()=>$('#mailTo').focus(),250);
}
function closeMail(){
  $('#mailSheet').classList.remove('on');
  document.body.style.overflow = $('#sheet').classList.contains('on') ? 'hidden' : '';
}
$('#mailClose').onclick=closeMail;
$('#mailSheet').onclick=e=>{ if(e.target.id==='mailSheet') closeMail(); };

function mailtoFallback(f,to,note){
  const body=(note?note+'\n\n':'')+f.n+'\n'+viewUrl(f.id);
  window.location.href=`mailto:${encodeURIComponent(to||'')}?subject=${encodeURIComponent(f.n)}&body=${encodeURIComponent(body)}`;
}
$('#mailApp').onclick=()=>{
  if(!mailFor) return;
  mailtoFallback(mailFor,$('#mailTo').value.trim(),$('#mailNote').value.trim());
  closeMail();
};

$('#mailSend').onclick=async()=>{
  if(!mailFor) return;
  const to=$('#mailTo').value.trim(), note=$('#mailNote').value.trim();
  const hint=$('#mailHint');

  if(!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(to)){
    hint.className='dlg-hint err';
    hint.textContent='ناونیشانی ئیمەیڵ دروست نییە.';
    $('#mailTo').focus();
    return;
  }
  store.set('lastEmail',to);

  if(!CONFIG.API){ mailtoFallback(mailFor,to,note); closeMail(); return; }

  const btn=$('#mailSend');
  btn.disabled=true;
  hint.className='dlg-hint';
  hint.textContent='دەنێردرێت…';
  try{
    const r=await fetch(`${CONFIG.API}?action=email`,{
      method:'POST',
      headers:{'Content-Type':'text/plain;charset=utf-8'},
      body:JSON.stringify({action:'email',id:mailFor.id,to:to,note:note})
    });
    const j=await r.json();
    if(j && j.ok){
      hint.className='dlg-hint ok';
      hint.textContent='نێردرا ✓';
      ping('email',mailFor.id);
      setTimeout(()=>{ closeMail(); toast('فۆڕمەکە نێردرا بۆ '+to); },800);
    }else{
      hint.className='dlg-hint err';
      hint.textContent = j && j.error ? j.error : 'نەنێردرا — ئەپی ئیمەیڵ تاقی بکەوە.';
      btn.disabled=false;
    }
  }catch(e){
    hint.className='dlg-hint err';
    hint.textContent='پەیوەندی نەکرا — ئەپی ئیمەیڵ تاقی بکەوە.';
    btn.disabled=false;
  }
};

/* recently viewed */
function bump(f){
  let r=store.get('recent',[]);
  r=[f.id,...r.filter(x=>x!==f.id)].slice(0,12);
  store.set('recent',r);
}
/* optional analytics ping — silently ignored when API is empty */
function ping(action,id){
  if(!CONFIG.API) return;
  try{
    navigator.sendBeacon
      ? navigator.sendBeacon(`${CONFIG.API}?action=log&event=${action}&id=${encodeURIComponent(id)}`)
      : fetch(`${CONFIG.API}?action=log&event=${action}&id=${encodeURIComponent(id)}`,{mode:'no-cors'});
  }catch(e){}
}

/* ============================================================
   controls
   ============================================================ */
$('#q').addEventListener('input',e=>{
  query=e.target.value;
  $('#clearQ').classList.toggle('on',!!query);
  draw();
});
$('#clearQ').onclick=()=>{ query=''; $('#q').value=''; $('#clearQ').classList.remove('on'); draw(); $('#q').focus(); };

$('#vGrid').onclick=()=>{ view='grid'; store.set('view',view); $('#vGrid').classList.add('on'); $('#vList').classList.remove('on'); draw(); };
$('#vList').onclick=()=>{ view='list'; store.set('view',view); $('#vList').classList.add('on'); $('#vGrid').classList.remove('on'); draw(); };
if(view==='list'){ $('#vList').classList.add('on'); $('#vGrid').classList.remove('on'); }

$('#favBtn').onclick=()=>{
  onlyFav=!onlyFav;
  $('#favBtn').style.background = onlyFav?'rgba(245,158,11,.9)':'';
  if(onlyFav && !favs.length) toast('هێشتا هیچ فۆڕمێکی دڵخواز نییە');
  drawChips(); draw();
};

/* ============================================================
   install prompt
   ============================================================ */
let deferred=null;
window.addEventListener('beforeinstallprompt',e=>{
  e.preventDefault(); deferred=e;
  if(!store.get('noInstall',false)) setTimeout(()=>$('#install').classList.add('on'),2600);
});
$('#installGo').onclick=async()=>{
  $('#install').classList.remove('on');
  if(deferred){ deferred.prompt(); await deferred.userChoice; deferred=null; }
};
$('#installNo').onclick=()=>{ $('#install').classList.remove('on'); store.set('noInstall',true); };

/* iOS hint (iOS has no beforeinstallprompt) */
(function iosHint(){
  const iOS=/iPad|iPhone|iPod/.test(navigator.userAgent)&&!window.MSStream;
  const standalone=window.navigator.standalone||matchMedia('(display-mode: standalone)').matches;
  if(iOS && !standalone && !store.get('noIosHint',false)){
    setTimeout(()=>{
      toast('بۆ دابەزاندن: Share ← Add to Home Screen');
      store.set('noIosHint',true);
    },3200);
  }
})();

/* ============================================================
   live refresh from Apps Script (optional)
   ============================================================ */
async function refresh(){
  const cached=store.get('forms',null);
  if(cached && cached.length){ FORMS=cached; drawChips(); draw(); }
  if(!CONFIG.API) return;
  try{
    const r=await fetch(`${CONFIG.API}?action=list`,{cache:'no-store'});
    const j=await r.json();
    if(j && j.ok && Array.isArray(j.forms) && j.forms.length){
      FORMS=j.forms;
      store.set('forms',FORMS);
      drawChips(); draw();
    }
  }catch(e){ /* keep built-in list */ }
}

/* ============================================================
   boot
   ============================================================ */
setupPWA();
skeleton();
drawChips();
draw();
refresh();
$('#stamp').textContent = `${FORMS.length} فۆڕم • نوێکراوەتەوە ${new Date().toLocaleDateString('en-GB')}`;

if('serviceWorker' in navigator){
  window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
}
</script>
</body>
</html>
